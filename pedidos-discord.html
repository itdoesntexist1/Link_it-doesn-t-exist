<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi página web</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161616;
        --text: #f0f0f0;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161616;
      --text: #f0f0f0;
      color-scheme: dark;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .gate {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      box-sizing: border-box;
    }
    .gate h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 4px; }
    .gate form { display: flex; gap: 8px; }
    .gate input, .gate button {
      font: inherit;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--text) 30%, transparent);
      background: var(--bg);
      color: var(--text);
    }
    .gate button { cursor: pointer; }
    .error { color: #d33; min-height: 1.2em; margin: 0; font-size: 0.9rem; }
    [hidden] { display: none !important; }
    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 24px 16px 16px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .search {
      width: 100%;
      max-width: 480px;
      box-sizing: border-box;
      font: inherit;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--text) 30%, transparent);
      background: var(--bg);
      color: var(--text);
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 8px auto 24px;
      padding: 0 16px;
    }
    .product {
      border: 1px solid color-mix(in srgb, var(--text) 25%, transparent);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .empty { text-align: center; opacity: 0.7; }
    .product { cursor: pointer; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .modal {
      position: relative;
      background: var(--bg);
      color: var(--text);
      border-radius: 16px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-sizing: border-box;
    }
    .modal h2 { margin: 0 0 6px; font-size: 1.4rem; }
    .modal p { margin: 0 0 18px; opacity: 0.75; }
    .modal .options { display: flex; flex-direction: column; gap: 10px; }
    .modal .options button {
      font: inherit;
      font-weight: 600;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--text) 30%, transparent);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    .modal .close {
      position: absolute;
      top: 8px;
      right: 12px;
      border: none;
      background: none;
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
    }
    .modal .chosen { margin: 16px 0 0; font-weight: 600; min-height: 1.2em; }
    .address { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .address button {
      font: inherit;
      font-weight: 600;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #25a244;
      color: #fff;
      cursor: pointer;
    }
    .address input {
      font: inherit;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--text) 30%, transparent);
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
      width: 100%;
    }
  </style>
</head>
<body>
  <main id="content">
    <header class="topbar">
      <h1>GOMITAS LC</h1>
      <input type="search" class="search" placeholder="Buscar..." aria-label="Buscar">
    </header>
    <section class="products" id="products">
      <div class="product">Azulito</div>
      <div class="product">Gomitas preparadas</div>
    </section>
    <p class="empty" id="empty" hidden>No se encontraron productos</p>

    <div class="overlay" id="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <button class="close" id="closeModal" aria-label="Cerrar">&times;</button>
        <h2 id="modalTitle"></h2>
        <p>¿Cómo lo quieres?</p>
        <div class="options">
          <button type="button" data-option="Pedir a domicilio">Pedir a domicilio</button>
          <button type="button" data-option="Comer aquí">Comer aquí</button>
        </div>
        <div class="address" id="address" hidden>
          <input type="text" id="calle" placeholder="Calle" autocomplete="off">
          <input type="text" id="direccion" placeholder="Dirección" autocomplete="off">
          <button type="button" id="sendOrder">Enviar pedido</button>
        </div>
        <p class="chosen" id="chosen"></p>
      </div>
    </div>
  </main>

  <script>
    function normalize(s) {
      return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }
    document.querySelector(".search").addEventListener("input", function (e) {
      var q = normalize(e.target.value.trim());
      var items = document.querySelectorAll(".product");
      var visible = 0;
      items.forEach(function (el) {
        var match = normalize(el.textContent).indexOf(q) !== -1;
        el.hidden = !match;
        if (match) visible++;
      });
      document.getElementById("empty").hidden = visible !== 0;
    });
    var overlay = document.getElementById("overlay");
    var chosen = document.getElementById("chosen");
    document.querySelectorAll(".product").forEach(function (el) {
      el.addEventListener("click", function () {
        document.getElementById("modalTitle").textContent = el.textContent;
        chosen.textContent = "";
        document.getElementById("address").hidden = true;
        document.getElementById("calle").value = "";
        document.getElementById("direccion").value = "";
        overlay.hidden = false;
      });
    });
    document.querySelectorAll(".modal .options button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        chosen.textContent = "Elegiste: " + btn.dataset.option;
        document.getElementById("address").hidden = btn.dataset.option !== "Pedir a domicilio";
      });
    });
    document.getElementById("closeModal").addEventListener("click", function () {
      overlay.hidden = true;
    });
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) overlay.hidden = true;
    });
    var WEBHOOK_URL = "https://discord.com/api/webhooks/1569086544747171964/S_DaLzYFZbrdAIJSCyD98QPoGtidywxoojx4M4ja1Ofi-0le-mrsEmFtHbB5tFLWViGK";
    var sendBtn = document.getElementById("sendOrder");
    sendBtn.addEventListener("click", function () {
      var calle = document.getElementById("calle").value.trim();
      var direccion = document.getElementById("direccion").value.trim();
      if (!calle || !direccion) {
        chosen.textContent = "Escribe la calle y la dirección";
        return;
      }
      var producto = document.getElementById("modalTitle").textContent;
      var mensaje = "🛵 **Nuevo pedido a domicilio**\n" +
        "**Producto:** " + producto + "\n" +
        "**Calle:** " + calle + "\n" +
        "**Dirección:** " + direccion;
      sendBtn.disabled = true;
      chosen.textContent = "Enviando pedido...";
      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: mensaje })
      }).then(function (r) {
        if (!r.ok) throw new Error("error");
        chosen.textContent = "¡Pedido enviado! Pronto te contactamos.";
        document.getElementById("calle").value = "";
        document.getElementById("direccion").value = "";
      }).catch(function () {
        chosen.textContent = "No se pudo enviar el pedido. Intenta de nuevo.";
      }).then(function () {
        sendBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
