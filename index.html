<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f2f2f2}
.wrap{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
img.logo{width:min(70vw,260px);height:auto;display:block;user-select:none;-webkit-user-drag:none}
.aviso{max-width:320px;text-align:center;font-size:13px;line-height:1.5;color:#b0b0b0;background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:14px 16px}
.aviso strong{color:#fff}
.btns{display:flex;flex-direction:column;gap:12px;width:min(100%,320px)}
.btn{appearance:none;border:1px solid #3a3a3a;background:#111;color:#f2f2f2;font-size:14px;font-weight:700;letter-spacing:.12em;padding:15px 20px;border-radius:14px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98);background:#222}
.btn.primary{background:#1a1a1a;border-color:#4a4a4a}
.btn.inject{letter-spacing:.18em;font-size:15px}
.status{min-height:18px;font-size:12px;color:#888;text-align:center;max-width:320px;line-height:1.4}
</style>

  const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  const link=document.createElement("link");
  link.rel="manifest";
  link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);

  const status=document.getElementById("status");
  let pipWindow=null;

  function isAndroid(){return /android/i.test(navigator.userAgent)}
  function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}

  async function openPip(){
    // Document Picture-in-Picture (Chrome / Edge reciente)
    if(window.documentPictureInPicture){
      try{
        if(pipWindow && !pipWindow.closed){
          pipWindow.close();
          pipWindow=null;
          status.textContent="PiP cerrado.";
          return;
        }
        pipWindow=await documentPictureInPicture.requestWindow({
          width:65,
          height:65
        });
        const doc=pipWindow.document;
        doc.head.innerHTML='<style>*{margin:0;padding:0}html,body{width:100%;height:100%;background:#000;overflow:hidden} .box{width:65px;height:65px;background:#000;border:1px solid #222}</style>';
        doc.body.innerHTML='<div class="box" title="ZX"></div>';
        // mantener negro y pequeño
        pipWindow.addEventListener("pagehide",function(){ pipWindow=null; status.textContent="PiP cerrado."; });
        status.textContent="PiP activo (65×65). Puedes cambiar a Free Fire.";
        return true;
      }catch(e){
        status.textContent="No se pudo abrir PiP: "+(e.message||e);
      }
    }

    // Fallback: Video PiP con canvas negro 65x65
    try{
      const canvas=document.createElement("canvas");
      canvas.width=65; canvas.height=65;
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,65,65);
      const stream=canvas.captureStream(5);
      const video=document.createElement("video");
      video.muted=true;
      video.playsInline=true;
      video.srcObject=stream;
      video.style.position="fixed";
      video.style.width="1px";
      video.style.height="1px";
      video.style.opacity="0";
      document.body.appendChild(video);
      await video.play();
      if(document.pictureInPictureElement){
        await document.exitPictureInPicture();
        status.textContent="PiP cerrado.";
        video.remove();
        return true;
      }
      if(video.requestPictureInPicture){
        await video.requestPictureInPicture();
        status.textContent="PiP activo (65×65 negro). Cambia a Free Fire.";
        video.addEventListener("leavepictureinpicture",function(){
          video.remove();
          status.textContent="PiP cerrado.";
        });
        return true;
      }
    }catch(e){
      status.textContent="PiP no soportado aquí: "+(e.message||e);
      return false;
    }

    status.textContent="Tu navegador no soporta PiP. Prueba Chrome en Android o escritorio.";
    return false;
  }

  function openFreeFire(){
    status.textContent="Abriendo Free Fire…";
    if(isAndroid()){
      const packages=["com.dts.freefireth","com.dts.freefiremax"];
      let tried=0;
      function tryNext(){
        if(tried>=packages.length){
          status.textContent="No se encontró Free Fire. Abriendo la tienda…";
          window.location.href="market://details?id=com.dts.freefireth";
          setTimeout(function(){window.location.href="https://play.google.com/store/apps/details?id=com.dts.freefireth"},800);
          return;
        }
        const pkg=packages[tried++];
        window.location.href="intent://#Intent;scheme=https;package="+pkg+";S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3D"+pkg+";end";
        setTimeout(tryNext,1200);
      }
      tryNext();
      return;
    }
    if(isIOS()){
      const appStore="https://apps.apple.com/app/id1300146617";
      ["freefire://","garenafreefire://"].forEach(function(s,i){
        setTimeout(function(){
          const a=document.createElement("a");a.href=s;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
        },i*500);
      });
      setTimeout(function(){ if(!document.hidden){ status.textContent="Si no se abrió, ve a la App Store…"; window.location.href=appStore; } },1800);
      return;
    }
    status.textContent="Abre Free Fire desde la tienda de apps.";
    window.open("https://play.google.com/store/apps/details?id=com.dts.freefireth","_blank");
  }

  document.getElementById("pipBtn").addEventListener("click",function(){ openPip(); });
  document.getElementById("injectBtn").addEventListener("click",async function(){
    // Primero PiP, luego Free Fire
    await openPip();
    setTimeout(openFreeFire, 400);
  });
})();
