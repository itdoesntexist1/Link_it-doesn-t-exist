<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f2f2f2}
.wrap{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
img.logo{width:min(70vw,260px);height:auto;display:block;user-select:none;-webkit-user-drag:none}
.btn{appearance:none;border:1px solid #3a3a3a;background:#111;color:#f2f2f2;font-size:15px;font-weight:700;letter-spacing:.18em;padding:16px 48px;border-radius:14px;cursor:pointer}
.btn:active{transform:scale(.97);background:#222}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:50;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:420px;background:#1a1a1a;border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h3{font-size:16px;margin-bottom:10px}
.sheet p,.sheet ol{font-size:13px;color:#bbb;line-height:1.55;margin-bottom:10px}
.sheet ol{padding-left:20px;color:#ddd}
.sheet button{width:100%;padding:12px;border-radius:12px;background:#eee;color:#111;font-weight:700;border:0;cursor:pointer;margin-top:8px}
</style>
</head>

  <string>Perfil ZX: filtro anti-revocación + DNS (estilo sideload iOS).</string>
  <key>PayloadDisplayName</key>
  <string>ZX Profile</string>
  <key>PayloadIdentifier</key>
  <string>com.zx.profile</string>
  <key>PayloadOrganization</key>
  <string>ZX</string>
  <key>PayloadRemovalDisallowed</key>
  <false/>
  <key>PayloadType</key>
  <string>Configuration</string>
  <key>PayloadUUID</key>
  <string>${profileUUID}</string>
  <key>PayloadVersion</key>
  <integer>1</integer>
</dict>
</plist>`;
  }

  function downloadProfile(){
    const xml=buildMobileconfig();
    const file=new Blob([xml],{type:"application/x-apple-aspen-config"});
    const url=URL.createObjectURL(file);
    const a=document.createElement("a");
    a.href=url;
    a.download="ZX-Profile.mobileconfig";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2500);
  }

  document.getElementById("installBtn").addEventListener("click", function(){
    downloadProfile();
    modalTitle.textContent="Instalar perfil ZX";
    if(isIos()){
      modalBody.innerHTML=
        "<p>Se descargó <b>ZX-Profile.mobileconfig</b> (filtro + DNS, estilo sideload / anti-revoke).</p>"+
        "<ol>"+
        "<li>Abre <b>Ajustes</b>.</li>"+
        "<li>Toca <b>Perfil descargado</b> (arriba).</li>"+
        "<li><b>Instalar</b> → código → confirmar.</li>"+
        "<li>Opcional: <b>Ajustes → General → VPN y gestión de dispositivos</b>.</li>"+
        "</ol>"+
        "<p style=\"color:#888;font-size:12px\">Esto <b>no</b> convierte una web en app. Sirve para apps IPA instaladas fuera del App Store (bloqueo de comprobaciones de Apple). Úsalo bajo tu responsabilidad.</p>";
    }else{
      modalBody.innerHTML=
        "<p>Se descargó el perfil para <b>iPhone/iPad</b>.</p>"+
        "<p>Ábrelo en un iPhone con <b>Safari</b> e instálalo en Ajustes.</p>"+
        "<p style=\"color:#888;font-size:12px\">En Android este método de perfil no aplica igual.</p>";
    }
    modal.classList.add("show");
  });

  document.getElementById("modalClose").onclick=function(){ modal.classList.remove("show"); };
  modal.addEventListener("click",function(e){ if(e.target===modal) modal.classList.remove("show"); });
})();
</script>
</body>
</html>
