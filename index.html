<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ZYOX AI</title>
<script src="https://js.puter.com/v2/" defer></script>
<style>
:root{color-scheme:dark;--bg:#000;--surface:#111;--surface2:#1a1a1a;--line:#292929;--text:#f4f4f4;--muted:#929292;--accent:#d8d8d8;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{color:inherit;-webkit-tap-highlight-color:transparent}.app{height:100dvh;display:flex;overflow:hidden;background:var(--bg)}
.sidebar{width:280px;flex:0 0 280px;background:#080808;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(14px + var(--safe-top)) 12px 12px;transition:transform .22s ease;z-index:10}.side-head{display:flex;align-items:center;justify-content:space-between;padding:2px 5px 20px}.brand{font-size:19px;font-weight:750;letter-spacing:.08em}.side-icon,.top-icon{width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:#c9c9c9;display:grid;place-items:center;cursor:pointer}.side-icon:hover,.top-icon:hover{background:#1a1a1a}.new-chat{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #303030;background:#111;border-radius:13px;padding:12px 14px;text-align:left;cursor:pointer;font-size:14px}.new-chat:hover{background:#191919}.history-label{padding:23px 10px 9px;color:#777;font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}.history{overflow:auto;flex:1}.history-item{width:100%;display:block;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;color:#aaa;border-radius:10px;padding:10px;font-size:13px;cursor:pointer}.history-item:hover,.history-item.active{background:#1b1b1b;color:#fff}.side-foot{border-top:1px solid #1e1e1e;padding:13px 8px 2px;color:#777;font-size:11px;line-height:1.5}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;padding:calc(4px + var(--safe-top)) 18px 4px;border-bottom:1px solid rgba(255,255,255,.04)}.top-left,.top-actions{display:flex;align-items:center;gap:8px}.mobile-brand{display:none;font-size:15px;font-weight:700;letter-spacing:.06em}.model-name{font-size:14px;font-weight:620;color:#e8e8e8}.model-chevron{font-size:12px;color:#858585;margin-left:4px}.top-actions button{border:1px solid #292929;background:#0d0d0d;border-radius:11px;height:36px;padding:0 12px;font-size:12px;color:#ccc;cursor:pointer}.top-actions button:hover{background:#1a1a1a}.feed{flex:1;overflow:auto;scroll-behavior:smooth;padding:30px 20px 24px}.thread{width:min(760px,100%);margin:0 auto;display:flex;flex-direction:column;gap:25px}.welcome{min-height:min(50vh,460px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 0 16px}.welcome-mark{width:42px;height:42px;border:1px solid #363636;border-radius:15px;display:grid;place-items:center;font-size:19px;color:#eee;margin-bottom:22px;background:linear-gradient(145deg,#191919,#080808)}.welcome h1{font-size:clamp(27px,5vw,38px);line-height:1.12;letter-spacing:-.04em;margin:0 0 11px;font-weight:650}.welcome p{font-size:14px;color:#929292;margin:0;line-height:1.55}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(620px,100%);margin-top:30px}.suggestion{min-height:61px;text-align:left;border:1px solid #292929;border-radius:14px;background:#0d0d0d;padding:12px 14px;color:#c8c8c8;font-size:13px;line-height:1.4;cursor:pointer}.suggestion:hover{background:#171717;border-color:#3b3b3b}.message{display:flex;flex-direction:column;gap:8px;animation:appear .18s ease}.message.user{align-items:flex-end}.message.ai{align-items:flex-start}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.message-label{font-size:11px;color:#777;padding:0 4px}.bubble{max-width:min(88%,680px);font-size:15px;line-height:1.72;overflow-wrap:anywhere}.user .bubble{background:#1d1d1d;border:1px solid #292929;padding:11px 15px;border-radius:18px 18px 5px 18px;white-space:pre-wrap}.ai .bubble{white-space:normal;color:#e6e6e6}.ai .bubble p{margin:0 0 13px}.ai .bubble p:last-child{margin-bottom:0}.ai .bubble pre{white-space:pre;overflow:auto;background:#101010;border:1px solid #292929;border-radius:12px;padding:14px 15px;margin:12px 0;font-size:13px;line-height:1.6;color:#e8e8e8}.ai .bubble code.inline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:#1c1c1c;border:1px solid #303030;border-radius:5px;padding:1px 5px}.ai .bubble ul,.ai .bubble ol{padding-left:23px}.ai .bubble a{color:#ddd}.typing{color:#8b8b8b;font-size:14px;display:flex;align-items:center;gap:9px}.dots{display:flex;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:#aaa;animation:blink 1s infinite alternate}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes blink{to{opacity:.25;transform:translateY(-2px)}}
.composer-wrap{flex:0 0 auto;padding:10px 18px calc(14px + var(--safe-bottom));background:linear-gradient(transparent,#000 20%)}.composer-area{width:min(760px,100%);margin:0 auto}.composer{display:flex;align-items:flex-end;gap:9px;min-height:58px;padding:9px 10px 9px 17px;background:#111;border:1px solid #333;border-radius:20px;box-shadow:0 8px 32px #0009}.composer:focus-within{border-color:#4b4b4b}.composer textarea{flex:1;min-width:0;min-height:38px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:#f2f2f2;padding:9px 0;font-size:15px;line-height:1.4}.composer textarea::placeholder{color:#777}.send{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:14px;background:#eee;color:#111;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:700}.send:disabled{opacity:.42;cursor:default}.composer-note{text-align:center;color:#666;font-size:10px;margin:9px 8px 0;line-height:1.4}.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:8}.overlay.show{display:block}.empty-history{padding:10px;color:#656565;font-size:12px}
@media(max-width:700px){.sidebar{position:absolute;inset:0 auto 0 0;width:min(82vw,300px);transform:translateX(-102%);box-shadow:18px 0 45px #0009}.sidebar.open{transform:translateX(0)}.mobile-brand{display:block}.model-name{display:none}.topbar{height:58px;flex-basis:58px;padding-left:10px;padding-right:12px}.top-actions button{height:34px;padding:0 10px}.feed{padding:19px 16px 20px}.welcome{min-height:calc(51dvh - 60px);padding-top:0}.welcome h1{font-size:29px}.welcome p{font-size:13px}.suggestions{grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.suggestion{padding:11px 10px;min-height:65px;font-size:12px}.composer-wrap{padding:8px 11px calc(10px + var(--safe-bottom))}.composer{border-radius:18px;padding:7px 8px 7px 14px;min-height:55px}.composer textarea{font-size:16px}.bubble{max-width:94%;font-size:14px}.thread{gap:21px}}
@media(max-width:380px){.suggestions{grid-template-columns:1fr}.welcome{min-height:auto;padding:36px 0 10px}.welcome-mark{margin-bottom:15px}.suggestion{min-height:48px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversaciones">
    <div class="side-head"><div class="brand">ZYOX</div><button class="side-icon" id="closeSidebar" aria-label="Cerrar menú" title="Cerrar menú">×</button></div>
    <button class="new-chat" id="newChat"><span aria-hidden="true">＋</span><span>Nuevo chat</span></button>
    <div class="history-label">Recientes</div>
    <div class="history" id="history"></div>
    <div class="side-foot">Tus conversaciones se guardan en este dispositivo.</div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button class="top-icon" id="menuBtn" aria-label="Abrir conversaciones" title="Conversaciones">☰</button><div class="mobile-brand">ZYOX</div><div class="model-name">ZYOX AI <span class="model-chevron">⌄</span></div></div>
      <div class="top-actions"><button id="shareBtn" title="Copiar conversación">Compartir</button></div>
    </header>
    <section class="feed" id="feed" aria-live="polite">
      <div class="thread" id="thread">
        <div class="welcome" id="welcome">
          <div class="welcome-mark">✳</div>
          <h1>¿En qué estás pensando?</h1>
          <p>Pregunta, explora una idea o empieza algo nuevo.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Ayúdame a entender una idea compleja de forma sencilla.">Explícame algo difícil de forma sencilla</button>
            <button class="suggestion" data-prompt="Ayúdame a escribir y mejorar un texto. Primero pregúntame qué quiero comunicar.">Ayúdame a escribir algo</button>
            <button class="suggestion" data-prompt="Quiero aprender una habilidad nueva. Propón un plan práctico para empezar.">Crea un plan para aprender algo</button>
            <button class="suggestion" data-prompt="Ayúdame a resolver este problema paso a paso: ">Resuelve un problema paso a paso</button>
          </div>
        </div>
      </div>
    </section>
    <footer class="composer-wrap">
      <div class="composer-area">
        <div class="composer"><textarea id="prompt" rows="1" placeholder="Pregunta lo que quieras…" aria-label="Escribe tu mensaje"></textarea><button class="send" id="send" aria-label="Enviar" title="Enviar">↑</button></div>
        <div class="composer-note">Verifica la información importante. La IA puede equivocarse.</div>
      </div>
    </footer>
  </main>
</div>
<script>
(() => {
  const STORE_KEY = "zyox_chat_conversations_v1";
  const feed = document.getElementById("feed"), thread = document.getElementById("thread");
  const input = document.getElementById("prompt"), sendButton = document.getElementById("send");
  const sidebar = document.getElementById("sidebar"), overlay = document.getElementById("overlay");
  let chats = loadChats(), activeId = null, busy = false;

  function loadChats(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]")}catch(_){return []}}
  function saveChats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(chats))}catch(_){}}
  function uid(){return "c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function newChat(){activeId=null;thread.innerHTML="";thread.appendChild(makeWelcome());input.value="";resizeInput();renderHistory();closeMenu();input.focus()}
  function makeWelcome(){const wrap=document.createElement("div");wrap.className="welcome";wrap.id="welcome";wrap.innerHTML='<div class="welcome-mark">✳</div><h1>¿En qué estás pensando?</h1><p>Pregunta, explora una idea o empieza algo nuevo.</p><div class="suggestions"><button class="suggestion" data-prompt="Ayúdame a entender una idea compleja de forma sencilla.">Explícame algo difícil de forma sencilla</button><button class="suggestion" data-prompt="Ayúdame a escribir y mejorar un texto. Primero pregúntame qué quiero comunicar.">Ayúdame a escribir algo</button><button class="suggestion" data-prompt="Quiero aprender una habilidad nueva. Propón un plan práctico para empezar.">Crea un plan para aprender algo</button><button class="suggestion" data-prompt="Ayúdame a resolver este problema paso a paso: ">Resuelve un problema paso a paso</button></div>';return wrap}
  function currentChat(){return chats.find(c=>c.id===activeId)}
  function renderHistory(){const list=document.getElementById("history");if(!chats.length){list.innerHTML='<div class="empty-history">Tus chats aparecerán aquí</div>';return}list.innerHTML="";chats.slice().sort((a,b)=>b.updated-a.updated).forEach(chat=>{const b=document.createElement("button");b.className="history-item"+(chat.id===activeId?" active":"");b.textContent=chat.title||"Nueva conversación";b.title=b.textContent;b.onclick=()=>openChat(chat.id);list.appendChild(b)})}
  function openChat(id){const chat=chats.find(c=>c.id===id);if(!chat)return;activeId=id;thread.innerHTML="";chat.messages.forEach(m=>addMessage(m.role,m.content,false));renderHistory();closeMenu();scrollBottom()}
  function addMessage(role,text,persist=true){const node=document.createElement("article");node.className="message "+(role==="user"?"user":"ai");const label=document.createElement("div");label.className="message-label";label.textContent=role==="user"?"Tú":"ZYOX AI";const bubble=document.createElement("div");bubble.className="bubble";bubble.innerHTML=renderText(text);node.append(label,bubble);thread.appendChild(node);if(persist&&activeId){const c=currentChat();if(c){c.messages.push({role:role==="user"?"user":"assistant",content:text});c.updated=Date.now();saveChats();renderHistory()}}scrollBottom();return bubble}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function renderText(text){let s=escapeHtml(text);const blocks=[];s=s.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{blocks.push('<pre><code>'+code.trim()+'</code></pre>');return "\u0000"+(blocks.length-1)+"\u0000"});s=s.replace(/`([^`]+)`/g,'<code class="inline">$1</code>');s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");s=s.replace(/\*(.+?)\*/g,"<em>$1</em>");const paras=s.split(/\n{2,}/).map(p=>{if(/^\u0000\d+\u0000$/.test(p.trim()))return p.trim();let q=p.replace(/\n/g,"<br>");q=q.replace(/^(?:[-*])\s+(.+)$/gm,"• $1");return "<p>"+q+"</p>"}).join("");return paras.replace(/\u0000(\d+)\u0000/g,(_,n)=>blocks[Number(n)]||"")}
  function showTyping(){const n=document.createElement("article");n.className="message ai";n.id="typing";n.innerHTML='<div class="message-label">ZYOX AI</div><div class="typing">Pensando <span class="dots"><i></i><i></i><i></i></span></div>';thread.appendChild(n);scrollBottom();return n}
  function scrollBottom(){requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight})}
  function resizeInput(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px";sendButton.disabled=busy||!input.value.trim()}
  function closeMenu(){sidebar.classList.remove("open");overlay.classList.remove("show")}
  function toggleMenu(){sidebar.classList.toggle("open");overlay.classList.toggle("show")}
  function buildPromptMessages(){const c=currentChat();const history=c?c.messages.slice(-20):[];return [{role:"system",content:"Eres un asistente inteligente, útil, honesto y cuidadoso. Responde en español salvo que el usuario pida otro idioma. Comprende el contexto, razona paso a paso cuando sea útil, y ofrece respuestas claras, completas y naturales. Si no sabes algo o hay incertidumbre, dilo. Usa ejemplos y formato legible cuando ayuden."},...history]}
  async function askAI(){const text=input.value.trim();if(!text||busy)return;if(!activeId){activeId=uid();chats.unshift({id:activeId,title:text.slice(0,56),messages:[],updated:Date.now()})}const c=currentChat();if(c&&c.messages.length===0)c.title=text.slice(0,56);addMessage("user",text);input.value="";resizeInput();busy=true;resizeInput();const typing=showTyping();let reply="";try{if(typeof puter==="undefined"||!puter.ai)throw new Error("El servicio de IA no está disponible. Revisa tu conexión e inténtalo otra vez.");const messages=buildPromptMessages();try{const stream=await puter.ai.chat(messages,{stream:true});typing.remove();const bubble=addMessage("assistant","",false);for await(const part of stream){const chunk=(part&&(part.text||part))||"";if(typeof chunk==="string"){reply+=chunk;bubble.innerHTML=renderText(reply);scrollBottom()}}if(!reply)reply="No recibí una respuesta. Inténtalo de nuevo.";bubble.innerHTML=renderText(reply)}catch(streamError){if(typing.isConnected)typing.remove();const response=await puter.ai.chat(messages);reply=typeof response==="string"?response:(response?.message?.content||response?.text||"");if(!reply)reply="No recibí una respuesta. Inténtalo de nuevo.";addMessage("assistant",reply,false)}const live=currentChat();if(live){live.messages.push({role:"assistant",content:reply});live.updated=Date.now();saveChats();renderHistory()}}catch(error){if(typing.isConnected)typing.remove();addMessage("assistant","No pude conectar con el servicio de IA. "+(error?.message||"Revisa tu conexión e inténtalo de nuevo."),false)}finally{busy=false;resizeInput();input.focus()}}
  document.getElementById("newChat").onclick=newChat;document.getElementById("menuBtn").onclick=toggleMenu;document.getElementById("closeSidebar").onclick=closeMenu;overlay.onclick=closeMenu;sendButton.onclick=askAI;input.addEventListener("input",resizeInput);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();askAI()}});
  document.getElementById("shareBtn").onclick=async()=>{const c=currentChat();if(!c||!c.messages.length)return;const text=c.messages.map(m=>(m.role==="user"?"Tú":"ZYOX AI")+":\n"+m.content).join("\n\n");try{await navigator.clipboard.writeText(text);const b=document.getElementById("shareBtn");const old=b.textContent;b.textContent="Copiado";setTimeout(()=>b.textContent=old,1300)}catch(_){}}
  thread.addEventListener("click",e=>{const b=e.target.closest("[data-prompt]");if(b){input.value=b.dataset.prompt;resizeInput();input.focus()}});
  renderHistory();
})();
</script>
</body>
</html>
