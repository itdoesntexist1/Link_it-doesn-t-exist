<style>
:root{--bg:#050505;--card2:#1a1a1a;--line:#2a2a2a;--text:#f2f2f2;--muted:#8a8a8a;--accent:#1db954;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;border:none;background:none;outline:none}
.app{height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:radial-gradient(ellipse at top,#141414 0%,#050505 55%)}
.header{padding:calc(14px + var(--safe-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:800;letter-spacing:.04em}.brand span{color:var(--accent)}
.install-btn{font-size:10px;font-weight:700;letter-spacing:.02em;padding:8px 10px;border-radius:10px;background:var(--accent);color:#000;cursor:pointer;max-width:48%;line-height:1.25;text-align:center}
.install-btn:active{opacity:.85}
.install-btn.hidden{display:none}
.install-modal{display:none;position:fixed;inset:0;background:#000c;z-index:80;align-items:flex-end;justify-content:center}
.install-modal.show{display:flex}
.install-sheet{width:100%;max-width:480px;background:#1a1a1a;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + var(--safe-bottom));}
.install-sheet h3{font-size:17px;margin-bottom:10px}
.install-sheet p{font-size:14px;color:#aaa;line-height:1.5;margin-bottom:14px}
.install-sheet ol{padding-left:20px;color:#ddd;font-size:14px;line-height:1.7;margin-bottom:16px}
.install-sheet button{width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#000;font-weight:700;font-size:14px;cursor:pointer}
.search-wrap{padding:0 16px 10px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.search-box:focus-within{border-color:#3a3a3a}
.search-box input{flex:1;min-width:0;font-size:15px}
.search-box input::placeholder{color:#666}
.search-btn{background:var(--accent);color:#000;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
.tabs{display:flex;gap:6px;padding:0 16px 8px}
.tab{flex:1;padding:9px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.tab.active{background:var(--card2);color:var(--text)}
.content{flex:1;overflow-y:auto;padding:4px 12px 210px;-webkit-overflow-scrolling:touch}
.count{font-size:12px;color:var(--muted);padding:6px 8px 10px}
.track{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer}
.track:active,.track.playing{background:var(--card2)}
.cover{width:52px;height:52px;border-radius:10px;background:#222;flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:#555;font-size:18px}
.cover img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0}
.title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;color:#000;background:var(--accent);padding:2px 6px;border-radius:6px;font-weight:700;margin-left:4px}
.badge.yt{background:#f00;color:#fff}
.actions{display:flex;gap:2px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:16px}
.icon-btn:active{background:#222;color:#fff}
.empty,.loading,.error{text-align:center;padding:36px 18px;color:var(--muted);font-size:14px;line-height:1.5}
.spinner{width:28px;height:28px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.player{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));background:linear-gradient(160deg,#1e1e1e,#111);border:1px solid #2e2e2e;border-radius:18px;padding:12px;box-shadow:0 12px 40px #000a;z-index:30;display:none}
.player.show{display:block}
.yt-wrap{display:none;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000;aspect-ratio:16/9}
.yt-wrap.show{display:block}
.yt-wrap iframe{width:100%;height:100%;border:0}
.player-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.player-cover{width:48px;height:48px;border-radius:10px;background:#222;overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:#555}
.player-cover img{width:100%;height:100%;object-fit:cover}
.player-meta{flex:1;min-width:0}
.player-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:12px;color:var(--muted);margin-top:2px}
.player-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 8px}
.ctrl{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:18px}
.ctrl.play{width:52px;height:52px;background:var(--accent);color:#000;font-size:20px;font-weight:700}
.progress-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{flex:1;height:4px;background:#333;border-radius:4px;cursor:pointer;overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--accent);border-radius:4px}
.player-actions{display:flex;gap:8px;margin-top:10px}
.player-actions button{flex:1;padding:10px;border-radius:12px;background:#222;color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
.player-actions button.primary{background:var(--accent);color:#000}
.player-actions button:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-bottom));transform:translateX(-50%) translateY(12px);background:#222;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.load-more{display:block;width:100%;margin:12px 0 20px;padding:12px;border-radius:12px;background:#1a1a1a;border:1px solid #2a2a2a;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.load-more:active{background:#222}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">ZYOX <span>Music</span></div>
    <button class="install-btn" id="installBtn" type="button">AÑADIR A PANTALLA DE INICIO</button>
  </header>
  <div class="search-wrap">
    <div class="search-box">
      <input id="q" type="search" placeholder="Cualquier canción o artista…" autocomplete="off" enterkeyhint="search">
      <button class="search-btn" id="searchBtn">Buscar</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="results">Todas</button>
    <button class="tab" data-tab="liked">Guardadas</button>
    <button class="tab" data-tab="free">Libres MP3</button>
  </div>
  <div class="content" id="content">
    <div class="empty">Busca cualquier canción.<br>Se muestran <b>todos</b> los resultados posibles (YouTube + libres).</div>
  </div>
  <div class="player" id="player">
    <div class="yt-wrap" id="ytWrap"></div>
    <div class="player-top">
      <div class="player-cover" id="pCover">♪</div>
      <div class="player-meta">
        <div class="player-title" id="pTitle">—</div>
        <div class="player-artist" id="pArtist">—</div>
      </div>
    </div>
    <div class="player-controls" id="audioControls">
      <button class="ctrl" id="btnPrev">⏮</button>
      <button class="ctrl play" id="btnPlay">▶</button>
      <button class="ctrl" id="btnNext">⏭</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <span id="tCur">0:00</span>
      <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
      <span id="tDur">0:00</span>
    </div>
    <div class="player-actions">
      <button id="btnLike">♡ Guardar</button>
      <button class="primary" id="btnDownload">↓ Descargar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="install-modal" id="installModal">
  <div class="install-sheet">
    <h3>Añadir a pantalla de inicio</h3>
    <p id="installText">Así se instala como una app normal.</p>
    <ol id="installSteps"></ol>
    <button type="button" id="installClose">Entendido</button>
  </div>
</div>
<audio id="audio" preload="metadata"></audio>

  function loadLiked(){ try{return JSON.parse(localStorage.getItem("zyox_music_liked_v3")||"[]")}catch{return[]} }

  function esc(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmt(s){ if(!isFinite(s)||s<0)return"0:00"; const m=Math.floor(s/60),sec=Math.floor(s%60); return m+":"+String(sec).padStart(2,"0"); }

  async function fetchJSON(url, timeout=9000){
    const ctrl = new AbortController();
    const id = setTimeout(()=>ctrl.abort(), timeout);
    try{
      const res = await fetch(url, { signal: ctrl.signal });
      if(!res.ok) throw new Error("HTTP "+res.status);
      return await res.json();
    } finally { clearTimeout(id); }
  }

  function mapInvidious(list){
    return (list||[]).filter(v => (v.type==="video"||v.videoId||v.videoID) && (v.videoId||v.videoID)).map(v=>{
      const id = v.videoId || v.videoID;
      let thumb = null;
      if(v.videoThumbnails && v.videoThumbnails.length){
        const mid = v.videoThumbnails.find(t=>t.quality==="medium"||t.quality==="high") || v.videoThumbnails[0];
        thumb = mid.url;
      }
      if(!thumb) thumb = "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";
      return { source:"youtube", id, title:v.title, artist:v.author||v.uploaderName||"YouTube", thumb, length:v.lengthSeconds||0, downloadable:false };
    });
  }

  function mapPiped(data){
    const items = data.items || data || [];
    return items.filter(v => v.type==="stream" || v.url || v.id).map(v=>{
      const id = v.id || (v.url||"").replace(/^\/watch\?v=/,"").split("&")[0];
      if(!id) return null;
      return {
        source:"youtube", id, title:v.title,
        artist: v.uploaderName || v.uploader || "YouTube",
        thumb: v.thumbnail || ("https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"),
        length: v.duration || 0, downloadable:false
      };
    }).filter(Boolean);
  }

  async function searchYouTubeAll(query){
    const results = [];
    const seen = new Set();
    // Try all Invidious in parallel-ish (first successes)
    const invPromises = INVIDIOUS.map(async base=>{
      try{
        const data = await fetchJSON(base+"/api/v1/search?type=video&q="+encodeURIComponent(query));
        return mapInvidious(Array.isArray(data)?data:[]);
      }catch{ return []; }
    });
    const pipedPromises = PIPED.map(async base=>{
      try{
        const data = await fetchJSON(base+"/search?q="+encodeURIComponent(query)+"&filter=all");
        return mapPiped(data);
      }catch{ return []; }
    });

    const all = await Promise.all([...invPromises, ...pipedPromises]);
    for(const list of all){
      for(const t of list){
        if(!t.id || seen.has(t.id)) continue;
        seen.add(t.id);
        results.push(t);
      }
    }
    return results;
  }

  async function searchAudius(query){
    try{
      const data = await fetchJSON(AUDIUS+"/tracks/search?query="+encodeURIComponent(query)+"&app_name=ZYOXMusic");
      return (data.data||[]).map(t=>({
        source:"audius", id:String(t.id), title:t.title,
        artist:(t.user&&t.user.name)||"Artista",
        thumb:(t.artwork&&(t.artwork["150x150"]||t.artwork["480x480"]))||null,
        stream:AUDIUS+"/tracks/"+t.id+"/stream", downloadable:true
      }));
    }catch{ return []; }
  }

  async function trendingAudius(){
    const data = await fetchJSON(AUDIUS+"/tracks/trending?app_name=ZYOXMusic");
    return (data.data||[]).slice(0,50).map(t=>({
      source:"audius", id:String(t.id), title:t.title,
      artist:(t.user&&t.user.name)||"Artista",
      thumb:(t.artwork&&(t.artwork["150x150"]||t.artwork["480x480"]))||null,
      stream:AUDIUS+"/tracks/"+t.id+"/stream", downloadable:true
    }));
  }

  function renderList(list, emptyMsg){
    if(!list||!list.length){
      content.innerHTML = '<div class="empty">'+(emptyMsg||"Sin resultados.")+'</div>';
      return;
    }
    const ytCount = list.filter(t=>t.source==="youtube").length;
    const freeCount = list.filter(t=>t.downloadable).length;
    let html = '<div class="count">'+list.length+' canciones'+(ytCount? ' · '+ytCount+' YouTube':'')+(freeCount? ' · '+freeCount+' con MP3':'')+'</div>';
    html += list.map((t,i)=>{
      const playing = queue[currentIndex] && String(queue[currentIndex].id)===String(t.id) && queue[currentIndex].source===t.source;
      const badge = t.source==="youtube" ? '<span class="badge yt">YT</span>' : (t.downloadable?'<span class="badge">MP3</span>':'');
      return `<div class="track ${playing?'playing':''}" data-i="${i}">
        <div class="cover">${t.thumb?`<img src="${esc(t.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'♪'}</div>
        <div class="meta"><div class="title">${esc(t.title)} ${badge}</div><div class="artist">${esc(t.artist)}</div></div>
        <div class="actions">${t.downloadable?`<button class="icon-btn" data-dl="${i}" title="MP3">↓</button>`:''}</div>
      </div>`;
    }).join("");
    content.innerHTML = html;
    content.querySelectorAll(".track").forEach(el=>{
      el.onclick = e=>{ if(e.target.closest("[data-dl]")) return; playAt(Number(el.dataset.i), list); };
    });
    content.querySelectorAll("[data-dl]").forEach(btn=>{
      btn.onclick = e=>{ e.stopPropagation(); downloadTrack(list[Number(btn.dataset.dl)]); };
    });
  }

  async function search(query){
    const q = (query||"").trim();
    if(!q) return;
    lastQuery = q;
    currentTab = "results";
    setTabUI();
    content.innerHTML = '<div class="loading"><div class="spinner"></div>Buscando todas las canciones…</div>';
    try{
      const [yt, free] = await Promise.all([searchYouTubeAll(q), searchAudius(q)]);
      // YouTube first (more complete), then free tracks not already conceptually duplicates
      const seenTitles = new Set();
      tracks = [];
      for(const t of yt){
        tracks.push(t);
        seenTitles.add((t.title||"").toLowerCase().slice(0,40));
      }
      for(const t of free){
        const key = (t.title||"").toLowerCase().slice(0,40);
        if(!seenTitles.has(key)) tracks.push(t);
      }
      renderList(tracks, "No encontré canciones para \""+esc(q)+"\".");
      if(!tracks.length) toast("Sin resultados");
      else toast(tracks.length+" canciones encontradas");
    }catch(err){
      content.innerHTML = '<div class="error">Error al buscar.<br>'+esc(err.message)+'</div>';
    }
  }

    currentTab = "free"; setTabUI();
    content.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando música libre…</div>';

      renderList(tracks, "No hay pistas libres.");

  function playAt(index, list){
    if(!list||!list[index]) return;
    queue = list.slice(); currentIndex = index;
    const t = queue[currentIndex];
    stopAll(); player.classList.add("show"); updatePlayerUI(t);

    if(t.source==="youtube"){
      document.getElementById("audioControls").style.display = "none";
      document.getElementById("progressWrap").style.display = "none";
      ytWrap.classList.add("show");
      ytWrap.innerHTML = '<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(t.id)+'?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
      document.getElementById("btnDownload").disabled = true;
      document.getElementById("btnDownload").textContent = "MP3 solo en libres";
    } else {
      document.getElementById("audioControls").style.display = "flex";
      document.getElementById("progressWrap").style.display = "flex";
      document.getElementById("btnDownload").disabled = !t.downloadable;
      document.getElementById("btnDownload").textContent = t.downloadable ? "↓ Descargar MP3" : "No disponible";
      audio.src = t.stream;
      audio.play().catch(()=>toast("No se pudo reproducir"));
    }
    if(currentTab==="liked") renderList(liked); else renderList(tracks);
  }

  function updatePlayerUI(t){
    document.getElementById("pTitle").textContent = t.title||"—";
    document.getElementById("pArtist").textContent = t.artist||"—";
    document.getElementById("pCover").innerHTML = t.thumb ? '<img src="'+esc(t.thumb)+'" alt="" referrerpolicy="no-referrer">' : "♪";
    const isLiked = liked.some(x=>String(x.id)===String(t.id)&&x.source===t.source);
    document.getElementById("btnLike").textContent = isLiked ? "♥ Guardada" : "♡ Guardar";
    document.getElementById("btnPlay").textContent = audio.paused ? "▶" : "❚❚";
  }

  function togglePlay(){
    const t = queue[currentIndex];
    if(!t||t.source==="youtube") return;
    if(audio.paused) audio.play(); else audio.pause();
  }
  function playNext(dir){
    if(!queue.length) return;
    currentIndex = (currentIndex+dir+queue.length)%queue.length;
    playAt(currentIndex, queue);
  }

  async function downloadTrack(track){
    if(!track||!track.downloadable||!track.stream){ toast("MP3 solo en canciones libres"); return; }
    toast("Preparando MP3…");
    try{
      const res = await fetch(track.stream);
      if(!res.ok) throw new Error("No disponible");
      const blob = await res.blob();
      const a = document.createElement("a");
      const href = URL.createObjectURL(blob);
      a.href = href;
      a.download = ((track.title||"track").replace(/[^\w\s\-áéíóúñÁÉÍÓÚÑ]/gi,"").trim().slice(0,60)||"track")+".mp3";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(href),2500);
      toast("Descarga iniciada");
    }catch{
      window.open(track.stream,"_blank");
      toast("Ábrelo y guárdalo como audio");
    }
  }

  function toggleLike(){
    const t = queue[currentIndex]; if(!t) return;
    const idx = liked.findIndex(x=>String(x.id)===String(t.id)&&x.source===t.source);
    if(idx>=0){ liked.splice(idx,1); toast("Eliminada"); }
    else { liked.unshift({...t}); toast("Guardada"); }
    saveLiked(); updatePlayerUI(t);
    if(currentTab==="liked") showLiked();
  }

      return;
    }
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (choice.outcome === "accepted") {
        installBtn.classList.add("hidden");
        toast("App añadida");
      }
      return;
    }
    if (isIos()) showIosGuide();
    else showAndroidGuide();
  });

  document.getElementById("installClose").onclick = () => installModal.classList.remove("show");
  installModal.addEventListener("click", (e) => {
    if (e.target === installModal) installModal.classList.remove("show");
  });


})();
</script>
</body>
</html>
